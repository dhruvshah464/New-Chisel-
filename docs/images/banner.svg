<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 480" width="100%" height="100%">
  <defs>
    <!-- Matte Brushed Copper / Bronze Gradient -->
    <linearGradient id="nc-copper" x1="0%" y1="55%" x2="100%" y2="25%">
      <stop offset="0%" stop-color="#5A3318" />
      <stop offset="35%" stop-color="#8F552E" />
      <stop offset="75%" stop-color="#C8824F" />
      <stop offset="100%" stop-color="#E5A26D" />
    </linearGradient>

    <!-- Matte Brushed Titanium / Silver Gradient -->
    <linearGradient id="nc-titanium" x1="0%" y1="80%" x2="95%" y2="15%">
      <stop offset="0%" stop-color="#686C6E" />
      <stop offset="45%" stop-color="#94999C" />
      <stop offset="85%" stop-color="#C9CDCF" />
      <stop offset="100%" stop-color="#E2E5E7" />
    </linearGradient>

    <!-- Subtle Drop Shadow for Depth -->
    <filter id="nc-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <g filter="url(#nc-shadow)">
    <!-- Left Monogram: "N" with Chisel Edge (Copper) -->
    <path fill="url(#nc-copper)" d="M 88 140 
          L 146 140 
          L 248 268 
          L 248 140 
          L 304 140 
          L 304 196 
          L 358 105 
          L 190 420 
          L 216 338 
          L 146 250 
          L 146 380 
          L 88 380 
          Z" />

    <!-- Right Monogram: "C" with Chisel Edge (Titanium Silver) -->
    <path fill="url(#nc-titanium)" d="M 398 60 
          L 222 390 
          L 298 324 
          A 122 122 0 0 0 492 342 
          L 451 304 
          A 66 66 0 1 1 451 216 
          L 492 178 
          A 122 122 0 0 0 366 144 
          Z" />
  </g>
</svg>
