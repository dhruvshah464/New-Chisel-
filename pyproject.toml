[project]
name = "aisec"
version = "0.1.0"
description = "New Chisel: independent, vendor-neutral attack tests for AI agents, with sealed evidence."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Dhruv Shah" }]
dependencies = [
    "mcp==2.1.1",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
model = ["anthropic==1.1.0"]
cloud = ["fastapi>=0.115", "uvicorn>=0.32", "python-multipart>=0.0.9", "httpx>=0.27"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24", "fastapi>=0.115", "httpx>=0.27"]

[project.scripts]
aisec = "aisec.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["aisec"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
